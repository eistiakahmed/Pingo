name: pingo_mobile
description: "Pingo - Smart Memory Assistant for Reminders, Voice Notes, and Important Documents"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Typography & Styling
  google_fonts: ^6.2.1
  intl: ^0.20.2

  # State Management
  flutter_riverpod: ^2.5.1

  # Networking & Cryptography
  http: ^1.2.1
  crypto: ^3.0.3

  # Utilities
  uuid: ^4.4.0
  speech_to_text: ^7.5.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  shared_preferences: ^2.2.3
  flutter_timezone: ^5.1.1

  # Firebase & Cloud Messaging (FCM)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

